{{FOOTER}}
<script src="/assets/swipe.js" defer></script>
<script>
(function(){
  var btn = document.querySelector('.menu-btn'), sheet = document.getElementById('menu');
  if (!btn || !sheet) return;
  function setOpen(open){
    sheet.hidden = !open;
    btn.setAttribute('aria-expanded', open ? 'true' : 'false');
    btn.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
    document.body.style.overflow = open ? 'hidden' : '';
    if (open) { var first = sheet.querySelector('a'); if (first) first.focus(); } else { btn.focus(); }
  }
  btn.addEventListener('click', function(){ setOpen(sheet.hidden); });
  sheet.addEventListener('click', function(e){ if (e.target.closest('a')) { sheet.hidden = true; btn.setAttribute('aria-expanded', 'false'); document.body.style.overflow = ''; } });
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape' && !sheet.hidden) setOpen(false); });
  window.addEventListener('resize', function(){ if (window.innerWidth > 1024 && !sheet.hidden) setOpen(false); });
})();
</script>
</body>
