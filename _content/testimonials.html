<div class="wrap">
  <header class="hdr">
    <div class="lbl">Testimonials<u></u>What people say</div>
    <h1>Kind words.</h1>
    <p class="lede">Recommendations from people I&rsquo;ve worked with.</p>
  </header>
  <div id="tsGrid"></div>
  <section class="cta">
    <h2>Want to work together?</h2>
    <div class="acts"><a class="btn" href="/contact/">Get in touch</a></div>
  </section>
</div>

<script src="/data/data.js"></script>
<script>
(function(){
  var D = window.SITE_DATA || {};
  function esc(t){ return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function newest(a, b){ return (b.date + b.id).localeCompare(a.date + a.id); }
  function initials(name){ var w = name.trim().split(/\s+/); return (w[0][0] + (w.length > 1 ? w[w.length - 1][0] : '')).toUpperCase(); }
  function who(t){
    return '<div class="who"><div class="av" aria-hidden="true">' + esc(initials(t.name)) + '</div><div><b>' + esc(t.name) + '</b>' +
      '<span>' + esc(t.role) + ', ' + esc(t.company) + '</span>' +
      (t.sourceUrl ? '<br><a href="' + esc(t.sourceUrl) + '" target="_blank" rel="noopener">Verified source &rarr;</a>' : '') + '</div></div>';
  }
  var ts = (D.testimonials || []).slice().sort(newest);
  var root = document.getElementById('tsGrid');
  if (!ts.length) {
    root.innerHTML = '<div class="empty-note"><h2>Recommendations will appear here.</h2><p>Kind words from colleagues and managers. For now, the best place to see how I work is the case studies.</p><a class="btn" href="/projects/">View projects</a></div>';
    return;
  }
  var first = ts[0], rest = ts.slice(1);
  root.innerHTML = '<section class="feat"><div class="mark-q" aria-hidden="true">&ldquo;</div><blockquote>' + esc(first.quote) + '</blockquote>' + who(first) + '</section>' +
    (rest.length ? '<section class="grid2">' + rest.map(function(t){ return '<div class="q"><p>' + esc(t.quote) + '</p>' + who(t) + '</div>'; }).join('') + '</section>' : '');
})();
</script>
