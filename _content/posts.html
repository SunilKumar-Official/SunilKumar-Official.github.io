<div class="wrap">
  <header class="hdr">
    <div class="lbl">Posts<u></u>Writing &amp; thoughts</div>
    <h1>Posts.</h1>
    <p class="lede">Short write-ups on data, BI and analytics, from LinkedIn and the communities I&rsquo;m part of.</p>
  </header>
  <div class="filters" id="poFilters"></div>
  <div id="poList"></div>
  <section class="cta">
    <h2>Have a question or idea?</h2>
    <div class="acts"><a class="btn" href="/contact/">Get in touch</a></div>
  </section>
</div>

<script src="/data/data.js"></script>
<script>
(function(){
  var D = window.SITE_DATA || {};
  var MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  function esc(t){ return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function newest(a, b){ return (b.date + b.id).localeCompare(a.date + a.id); }
  function monthYear(iso){ var p = iso.split('-'); return MONTHS[+p[1] - 1] + ' ' + p[0]; }

  var posts = (D.posts || []).slice().sort(newest);
  var list = document.getElementById('poList');
  if (!posts.length) {
    list.innerHTML = '<div class="empty-note"><h2>Posts will appear here.</h2><p>Short write-ups from LinkedIn and data communities, collected in one place. Until then, the case studies carry the detail.</p><a class="btn" href="/projects/">View projects</a></div>';
    return;
  }
  function chipRow(group, label, items){
    return '<div class="chips" data-g="' + group + '"><i>' + label + '</i><button type="button" class="on" data-v="all">All</button>' +
      items.map(function(i){ return '<button type="button" data-v="' + esc(i.value) + '">' + esc(i.label) + '</button>'; }).join('') + '</div>';
  }
  var sources = [], seen = {}, tags = {};
  posts.forEach(function(p){
    if (!seen[p.source]) { seen[p.source] = 1; sources.push({value: p.source, label: p.sourceLabel}); }
    (p.tags || []).forEach(function(t){ tags[t] = 1; });
  });
  var tagList = Object.keys(tags).sort().map(function(t){ return {value: t, label: t}; });
  document.getElementById('poFilters').innerHTML = chipRow('src', 'Source', sources) + (tagList.length ? chipRow('tag', 'Tag', tagList) : '');
  list.innerHTML = '<div class="plist">' + posts.map(function(p){
    return '<a class="post" href="' + esc(p.url) + '" target="_blank" rel="noopener" data-src="' + esc(p.source) + '" data-tags="' + esc((p.tags || []).join(' ')) + '">' +
      '<div class="d">' + monthYear(p.date) + '</div><div class="m"><b>' + esc(p.title) + '</b><span>' + esc(p.excerpt) + '</span></div>' +
      '<div class="s">' + esc(p.sourceLabel) + '</div><div class="a" aria-hidden="true">&nearr;</div></a>';
  }).join('') + '<div class="none" id="empty">No posts match these filters.</div></div>';

  var f = {src:'all', tag:'all'};
  function apply(){
    var n = 0;
    document.querySelectorAll('.post').forEach(function(r){
      var ok = (f.src === 'all' || r.dataset.src === f.src) && (f.tag === 'all' || r.dataset.tags.split(' ').indexOf(f.tag) > -1);
      r.style.display = ok ? '' : 'none'; if (ok) n++;
    });
    document.getElementById('empty').style.display = n ? 'none' : 'block';
  }
  document.querySelectorAll('.chips').forEach(function(g){
    g.querySelectorAll('button').forEach(function(b){
      b.addEventListener('click', function(){
        g.querySelectorAll('button').forEach(function(x){ x.classList.remove('on'); });
        b.classList.add('on'); f[g.dataset.g] = b.dataset.v; apply();
      });
    });
  });
})();
</script>
